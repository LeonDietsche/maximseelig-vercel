<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- VIEWPORT META FOR MOBILE SCALING -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAXIM SEELIG</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="manual-slideshow nav-right">
  <canvas id="canvas"></canvas>
  <div id="playlist"></div>
  <div id="playtime" role="timer" aria-label="Track playback time">0:00 / 0:00</div>

  <div id="emailOverlay" aria-live="polite">
    <div id="transportControls" role="group" aria-label="Playback controls">
      <button id="previousTrack" class="transport-button track-navigation" type="button" aria-label="Previous track">
        <span class="skip-icon skip-icon-previous" aria-hidden="true"></span>
      </button>

      <button id="listenPrompt" class="transport-button" type="button" aria-label="Play music">
        <span class="play-icon" aria-hidden="true"></span>
      </button>

      <button id="nextTrack" class="transport-button track-navigation" type="button" aria-label="Next track">
        <span class="skip-icon skip-icon-next" aria-hidden="true"></span>
      </button>
    </div>

    <a id="emailLink" href="mailto:contact@maximseelig.com">contact@maximseelig.com</a>
  </div>

  <script src="/script.js"></script>
</body>
</html>
